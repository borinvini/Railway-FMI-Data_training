# Linux/AMD environment for CSC Roihu. Built with Tykky:
#   module load tykky
#   conda-containerize new --prefix /projappl/<project>/railway-env environment-linux.yml
#
# Differences from the Windows environment.yml:
#   - no prefix:, no icc_rt/ucrt/vc/vc14_runtime/vs2015_runtime (Windows-only)
#   - nomkl + openblas instead of mkl/intel-openmp: Roihu is AMD Turin, where MKL
#     can select slow codepaths
#   - adds lightgbm, matplotlib, seaborn, haversine, pyarrow, pytest, which the code
#     imports but the Windows file omits
#
# Pinning policy: packages that affect numerical results stay pinned to the exact
# Windows versions (python, numpy, pandas, scipy, scikit-learn, xgboost, shap,
# imbalanced-learn, numba/llvmlite). Pure utilities are left unpinned, because a
# pin that cannot be satisfied on linux-64 costs a 10-20 minute rebuild to
# discover and buys no reproducibility.
#
# Known conda-forge/linux-64 gap: psutil 5.9.0 has no cp312 build (only 3.7-3.10
# and pypy), so pinning it made the whole solve fail against python 3.12.3.
name: venv_rail_fmi_training
channels:
  - conda-forge
dependencies:
  - python=3.12.3
  # BLAS: OpenBLAS rather than MKL, for AMD
  - nomkl
  - openblas
  # Core numerics
  - numpy=2.0.1
  - pandas=2.2.3
  - scipy=1.15.1
  - bottleneck
  - numexpr
  - pyarrow
  # ML
  - scikit-learn=1.6.1
  - xgboost=3.0.1
  - lightgbm
  - imbalanced-learn=0.13.0
  - sklearn-compat=0.1.3
  - shap=0.48.0
  - slicer=0.0.8
  - numba=0.61.2
  - llvmlite=0.44.0
  # Plotting (Agg backend, headless)
  - matplotlib
  - seaborn
  # Utilities — deliberately unpinned (see pinning policy above). psutil in
  # particular MUST stay unpinned: 5.9.0 has no cp312 build on conda-forge.
  - joblib=1.4.2
  - threadpoolctl=3.5.0
  - cloudpickle
  - psutil
  - tqdm
  - haversine
  - python-dateutil
  - pytz
  - tzdata
  - packaging
  - six
  - typing_extensions
  # Testing
  - pytest
